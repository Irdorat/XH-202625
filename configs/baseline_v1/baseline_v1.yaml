experiment:
  name: baseline_v1
  seed: 42

data:
  config: configs/baseline_v1/dataset.yaml

model:
  architecture: rtdetr-l
  weights: models/pretrained/rtdetr-l.pt

training:
  epochs: 50
  image_size: 640
  batch_size: 8
  device: 0
  workers: 8

  optimizer: AdamW
  learning_rate: 0.0001
  weight_decay: 0.0001
  warmup_epochs: 3
  patience: 10

augmentation:
  horizontal_flip: 0.5
  vertical_flip: 0.2
  rotation: 15.0
  mosaic: 1.0
  mixup: 0.0
  copy_paste: 0.0

output:
  directory: runs
  save_period: 10
